<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>تست کاتالوگ</title>
<style>
:root{--bg:#0a0f0d;--card:#131a17;--border:#1e2a24;--text:#d8e5de;--primary:#00d68f;--muted:#64756c}
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,sans-serif;background:var(--bg);color:var(--text);padding:16px}
h1{color:var(--primary);font-size:18px;margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px}
.debug{background:#1a2a20;border:1px solid #00d68f;border-radius:8px;padding:10px;font-size:12px;line-height:1.8;color:#00d68f}
.debug .err{color:#ff4757}
label{display:block;font-size:12px;margin-bottom:6px;color:var(--muted)}
select,input{width:100%;padding:10px;border:1.5px solid var(--border);border-radius:8px;background:#0a0f0d;color:var(--text);font-family:inherit;font-size:14px}
table{width:100%;border-collapse:collapse;font-size:12px;margin-top:10px}
th,td{padding:8px;border-bottom:1px solid var(--border);text-align:center}
th{background:rgba(0,214,143,.08);color:var(--primary);font-weight:700}
</style>
</head>
<body>

<h1>🔬 تست کاتالوگ</h1>

<div class="card">
  <div id="debug" class="debug">در حال اجرا...</div>
</div>

<div class="card">
  <label>دسته‌بندی</label>
  <select id="cat-category" onchange="renderCatalog()">
    <option value="">— انتخاب —</option>
  </select>
  <label style="margin-top:10px">جستجو</label>
  <input type="text" id="cat-search" placeholder="مثلاً 3000" oninput="renderCatalog()">
  <div id="cat-info" style="margin-top:10px;font-size:12px"></div>
</div>

<div class="card">
  <div id="cat-table"></div>
</div>

<script>
// ============ تست ساده — فقط ۳ دسته ============
const EMBEDDED_CATALOG = {
  version: '2025-01-15-test',
  categories: {
    "spiral": {
      name: "منبع اسپیرال",
      columns: [
        {key:"model",label:"مدل"},
        {key:"capacity",label:"حجم (L)"},
        {key:"D",label:"D (mm)"},
        {key:"H1",label:"H1"},
        {key:"thermal",label:"سطح حرارتی"},
        {key:"power45",label:"kW 45°C"}
      ],
      rows: [
        {model:"SG-HE-SC-1000",capacity:1000,D:920,H1:1500,thermal:70,power45:132},
        {model:"SG-HE-SC-2000",capacity:2000,D:1120,H1:2000,thermal:130,power45:191},
        {model:"SG-HE-SC-3000",capacity:3000,D:1400,H1:2000,thermal:190,power45:230},
        {model:"SG-HE-SC-4000",capacity:4000,D:1400,H1:2500,thermal:245,power45:250},
        {model:"SG-HE-SC-5000",capacity:5000,D:1450,H1:3000,thermal:280,power45:270}
      ]
    },
    "u-coil": {
      name: "منبع کوئلی U",
      columns: [
        {key:"model",label:"مدل"},
        {key:"capacity",label:"حجم (L)"},
        {key:"D",label:"D (mm)"},
        {key:"H1",label:"H1"},
        {key:"thermal",label:"سطح حرارتی"},
        {key:"manhole",label:"منهول"}
      ],
      rows: [
        {model:"SG-HE-C-1000",capacity:1000,D:920,H1:1500,thermal:27,manhole:"-"},
        {model:"SG-HE-C-2000",capacity:2000,D:1120,H1:2000,thermal:60,manhole:"دارد"},
        {model:"SG-HE-C-3000",capacity:3000,D:1400,H1:2000,thermal:83,manhole:"دارد"},
        {model:"SG-HE-C-4000",capacity:4000,D:1400,H1:2500,thermal:91,manhole:"دارد"},
        {model:"SG-HE-C-6000",capacity:6000,D:1600,H1:3000,thermal:120,manhole:"دارد"}
      ]
    },
    "softener": {
      name: "سختی‌گیر",
      columns: [
        {key:"model",label:"مدل"},
        {key:"grain",label:"ظرفیت (grain)"},
        {key:"gpm",label:"GPM"},
        {key:"D",label:"D (mm)"},
        {key:"H1",label:"H1"},
        {key:"resin",label:"رزین (L)"}
      ],
      rows: [
        {model:"SG-S-100",grain:100000,gpm:15,D:470,H1:1000,resin:75},
        {model:"SG-S-500",grain:500000,gpm:51,D:800,H1:1500,resin:425},
        {model:"SG-S-1000",grain:1000000,gpm:75,D:1000,H1:2000,resin:825},
        {model:"SG-S-2000",grain:2000000,gpm:120,D:1300,H1:2500,resin:1675},
        {model:"SG-S-3000",grain:3000000,gpm:170,D:1400,H1:3000,resin:2500}
      ]
    }
  }
};

// ============ منطق برنامه ============
let CATALOG = EMBEDDED_CATALOG;

function $(id){ return document.getElementById(id); }

function debug(msg, isErr){
  const d = $('debug');
  const cls = isErr ? 'err' : '';
  d.innerHTML += `<br><span class="${cls}">${msg}</span>`;
}

function init(){
  try{
    debug('✅ اسکریپت اجرا شد');
    debug('تعداد دسته‌ها: ' + Object.keys(CATALOG.categories).length);
    debug('نام دسته‌ها: ' + Object.keys(CATALOG.categories).join(', '));

    const sel = $('cat-category');
    if(!sel){
      debug('❌ dropdown پیدا نشد', true);
      return;
    }

    for(const key in CATALOG.categories){
      const opt = document.createElement('option');
      opt.value = key;
      opt.textContent = CATALOG.categories[key].name;
      sel.appendChild(opt);
    }

    debug('✅ dropdown پر شد — ' + (sel.options.length - 1) + ' گزینه');
  }catch(e){
    debug('❌ خطا: ' + e.message, true);
  }
}

function renderCatalog(){
  const catKey = $('cat-category').value;
  const search = $('cat-search').value.trim();
  const info = $('cat-info');
  const tbl = $('cat-table');

  if(!catKey){
    info.innerHTML = '';
    tbl.innerHTML = '<div style="padding:20px;text-align:center;color:#64756c">یک دسته انتخاب کنید</div>';
    return;
  }

  const cat = CATALOG.categories[catKey];
  if(!cat){
    debug('❌ دسته پیدا نشد: ' + catKey, true);
    return;
  }

  let rows = cat.rows;
  if(search){
    const s = search.toLowerCase();
    rows = rows.filter(r=>Object.values(r).some(v=>String(v).toLowerCase().includes(s)));
  }

  // نزدیک‌ترین
  let matchIdx = -1;
  const num = parseFloat(search);
  if(!isNaN(num) && /^\d+$/.test(search)){
    let bestDiff = Infinity;
    rows.forEach((r,i)=>{
      const cap = parseFloat(r.capacity) || parseFloat(r.grain) || 0;
      if(cap > 0){
        const d = Math.abs(cap - num);
        if(d < bestDiff){ bestDiff = d; matchIdx = i; }
      }
    });
  }

  info.innerHTML = `<strong>${cat.name}</strong> — ${rows.length} مدل` +
    (matchIdx >= 0 ? '<br>🎯 نزدیک‌ترین مدل سبز شده' : '');

  let html = '<table><thead><tr>';
  cat.columns.forEach(c=>{ html += `<th>${c.label}</th>`; });
  html += '</tr></thead><tbody>';

  rows.forEach((r, i)=>{
    const isMatch = i === matchIdx;
    const style = isMatch ? 'background:rgba(0,214,143,.12);color:#00ff9d;font-weight:700' : '';
    html += `<tr style="${style}">`;
    cat.columns.forEach(c=>{
      html += `<td>${r[c.key] != null ? r[c.key] : '—'}</td>`;
    });
    html += '</tr>';
  });

  html += '</tbody></table>';
  tbl.innerHTML = html;

  debug('نمایش ' + rows.length + ' ردیف از ' + cat.name);
}

// اجرا
window.addEventListener('load', ()=>{
  $('debug').innerHTML = '';
  init();
});
</script>
</body>
</html>
